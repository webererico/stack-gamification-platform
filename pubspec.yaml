name: stack_gamification_platform
description: "Plataforma gamificada de autoavaliação de skills técnicas por squad."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cloud_firestore: ^6.9.0
  equatable: ^2.1.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  fl_chart: ^1.2.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
